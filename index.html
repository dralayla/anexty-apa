<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B2540">
<title>Avaliação pré-anestésica Anexty</title>
<style>
/* Layout: barra fixa no topo com duas telas. Paciente = formulário em etapas, coluna única, pensado para celular. Ficha = lista de pacientes à esquerda e ficha completa à direita. */
:root{
  --top-bg:#0B2540; --top-fg:#FFFFFF;
  --bg:#F0F4F9; --surface:#FFFFFF; --line:#D0DCE8; --faint:#EEF2F7;
  --ink:#0B2540; --muted:#5E7189;
  --blue:#1F6FEB; --blue-soft:#E8F1FD; --btn-bg:#1F6FEB; --btn-fg:#FFFFFF;
  --ok-bg:#D4EDDA; --ok-fg:#155724; --ok-line:#A8D5B5;
  --warn-bg:#FFF1CC; --warn-fg:#6B4A00; --warn-line:#EBC45E;
  --bad-bg:#FDE3E1; --bad-fg:#8A1C1C; --bad-line:#EFA3A0;
  --sans:system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --top-bg:#091B30; --top-fg:#FFFFFF;
    --bg:#0D1520; --surface:#142133; --line:#27394F; --faint:#1A2B40;
    --ink:#E7EEF7; --muted:#93A5BA;
    --blue:#5B9BFF; --blue-soft:#17304F; --btn-bg:#5B9BFF; --btn-fg:#06101D;
    --ok-bg:#17361F; --ok-fg:#A8E0B4; --ok-line:#2C6B3C;
    --warn-bg:#3A2F10; --warn-fg:#F3D488; --warn-line:#7A6120;
    --bad-bg:#3F1A19; --bad-fg:#F7B4B1; --bad-line:#8A3A37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --top-bg:#091B30; --top-fg:#FFFFFF;
  --bg:#0D1520; --surface:#142133; --line:#27394F; --faint:#1A2B40;
  --ink:#E7EEF7; --muted:#93A5BA;
  --blue:#5B9BFF; --blue-soft:#17304F; --btn-bg:#5B9BFF; --btn-fg:#06101D;
  --ok-bg:#17361F; --ok-fg:#A8E0B4; --ok-line:#2C6B3C;
  --warn-bg:#3A2F10; --warn-fg:#F3D488; --warn-line:#7A6120;
  --bad-bg:#3F1A19; --bad-fg:#F7B4B1; --bad-line:#8A3A37;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.2px}
h2{font-size:19px}
h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--top-bg);color:var(--top-fg);display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:18px;letter-spacing:-.3px}
.brand span{font-size:12px;opacity:.75}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.12)}
.seg button{border:0;background:transparent;color:var(--top-fg);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--top-fg);color:var(--top-bg)}
.seg button:focus-visible{outline:2px solid var(--top-fg);outline-offset:2px}
.demo{background:var(--warn-bg);color:var(--warn-fg);padding:8px 16px;font-size:13px}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.pt{max-width:640px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:16px;min-width:0}
.head{display:grid;gap:4px}
.prog{height:6px;background:var(--faint);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.eyebrow{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.fields{display:grid;gap:18px}
.f{display:grid;gap:6px;min-width:0}
.f[hidden]{display:none}
.lbl{font-weight:600}
.req{color:var(--bad-fg)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad-fg);min-height:0}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-visible,summary:focus-visible,.item:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;display:inline-block}
.chips input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chips span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chips input:checked+span{background:var(--blue-soft);border-color:var(--blue);font-weight:600}
.chips input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.note{padding:10px 12px;border-radius:8px;background:var(--faint);font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.thumb{display:flex;gap:10px;align-items:center}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}
details{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
details .full{display:grid;gap:10px;margin-block-start:10px;font-size:14px}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}
.done{display:grid;gap:12px}
.done ol{margin:0;padding-left:20px;display:grid;gap:6px}

.fx{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:grid;gap:8px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.item{display:grid;gap:4px;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.item[aria-current="true"]{border-color:var(--blue);background:var(--blue-soft)}
.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item b{min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--faint);color:var(--muted);border:1px solid var(--line)}
.sem{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid;white-space:nowrap}
.sem::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.sem.verde{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line)}
.sem.amarelo{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.sem.vermelho{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-line)}
.detail{display:grid;gap:16px;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:flex;gap:10px}
.alerts li::before{content:'';flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.alerts li.vermelho::before{background:var(--bad-fg)}
.alerts li.amarelo::before{background:var(--warn-line)}
.alerts li.pend::before{background:transparent;border:2px solid var(--muted)}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ex .grp{grid-column:1/-1;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:6px 4px;border-block-end:1px solid var(--line)}
.ex .f.wide{grid-column:1/-1}
.ex .f.w2{grid-column:span 2}
.flag.amarelo{--fbg:var(--warn-bg);--fline:var(--warn-line);--ffg:var(--warn-fg)}
.flag.vermelho{--fbg:var(--bad-bg);--fline:var(--bad-line);--ffg:var(--bad-fg)}
.kv>div.flag{background:var(--fbg);color:var(--ffg);padding:8px 10px;border-radius:8px}
.kv>div.flag b{color:var(--ffg)}
.kv>div.flag b::after{content:' · atenção';text-transform:none;letter-spacing:0}
.kv>div.flag.vermelho b::after{content:' · alerta'}
.ex .f.flag input,.ex .f.flag select{background:var(--fbg);border-color:var(--fline);color:var(--ffg);font-weight:600}
.ex .f.flag .lbl::after{content:' · fora do esperado';font-weight:400;font-size:12px;color:var(--ffg)}
.air .row.flag{background:var(--fbg);border-radius:8px;padding:8px 10px}
.air .row.flag b::after{content:' · alterado';font-weight:400;font-size:12px;color:var(--ffg)}
.flagtxt.amarelo,.flagtxt.vermelho{background:var(--fbg);color:var(--ffg);padding:1px 7px;border-radius:5px;font-weight:600}
.air{display:grid;gap:12px}
.air .row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px 12px;align-items:center}
.air .say{font-size:13px;color:var(--muted);font-style:italic}
.rules{font-size:14px;display:grid;gap:6px}
.val{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stamp{font-size:13px;color:var(--ok-fg);background:var(--ok-bg);border-radius:8px;padding:6px 10px}
@media (max-width:860px){.fx{grid-template-columns:1fr}}
@media (max-width:560px){.air .row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

[hidden]{display:none!important}
input[type=password],input[type=email],input[type=tel]{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
select{min-width:0}
.login{max-width:420px}
.linkbox{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--faint)}
.linkbox code{word-break:break-all;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag.wait{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.msg{font-size:14px}
.msg.bad{color:var(--bad-fg)}
.msg.ok{color:var(--ok-fg)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.topbar .btn{padding:6px 12px;font-size:13px;background:transparent;color:var(--top-fg);border-color:rgba(255,255,255,.4)}
details .full h3{margin-block-start:6px}

</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><b>Anexty</b><span>Health Solutions</span></div>
  <div class="seg" id="seg" role="group" aria-label="Tela" hidden>
    <button type="button" id="tab-fx" aria-pressed="true">Fichas</button>
    <button type="button" id="tab-nv" aria-pressed="false">Novo convite</button>
    <button type="button" id="tab-md" aria-pressed="false">Modelos</button>
    <button type="button" id="tab-ac" aria-pressed="false">Conta</button>
  </div>
  <button type="button" class="btn" id="logout" hidden>Sair</button>
</div>
<main class="wrap">
  <section id="v-login" class="pt" aria-label="Entrar" hidden></section>
  <section id="v-pt" class="pt" aria-label="Formulário da paciente" hidden></section>
  <section id="v-fx" class="fx" aria-label="Fichas" hidden>
    <aside class="plist" id="plist"></aside>
    <div class="detail" id="detail"></div>
  </section>
  <section id="v-nv" class="pt" aria-label="Novo convite" hidden></section>
  <section id="v-md" class="pt" aria-label="Modelos de texto" hidden></section>
  <section id="v-ac" class="pt" aria-label="Conta" hidden></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
/* ===== Lógica de triagem (sem interface) ===== */
(function(){
  var DOENCAS=['Pressão alta','Diabetes','Asma ou bronquite','Problema no coração','Tireoide','Refluxo ou azia forte','Trombose ou coágulos','Anemia','Outra','Nenhuma dessas'];
  var DC_GROUPS=[
    ['dc_card','Coração e circulação',['Pressão alta','Problema no coração','Trombose ou coágulos','Varizes','Outra condição','Não tenho']],
    ['dc_resp','Pulmão e respiração',['Asma ou bronquite','Enfisema ou DPOC','Rinite ou sinusite','Apneia do sono','Outra condição','Não tenho']],
    ['dc_gastro','Estômago, intestino e fígado',['Refluxo ou azia forte','Gastrite ou úlcera','Hérnia de hiato','Gordura no fígado ou hepatite','Já fiz cirurgia bariátrica','Outra condição','Não tenho']],
    ['dc_neuro','Cérebro e nervos',['AVC (derrame)','Enxaqueca','Desmaio','Convulsão','Epilepsia','Ansiedade','Depressão','Outra condição','Não tenho']],
    ['dc_endo','Hormônios e metabolismo',['Diabetes','Tireoide','Colesterol alto','Outra condição','Não tenho']],
    ['dc_sangue','Sangue',['Anemia','Problema de coagulação ou sangramento fácil','Outra condição','Não tenho']],
    ['dc_renal','Rins e urina',['Problema nos rins','Pedra nos rins','Infecção urinária frequente','Outra condição','Não tenho']],
    ['dc_osso','Ossos, coluna e músculos',['Hérnia de disco ou problema na coluna','Artrose ou artrite','Fibromialgia','Outra condição','Não tenho']],
    ['dc_outros','Outras condições',['Doença autoimune (lúpus, artrite reumatoide)','Câncer (atual ou já tratado)','Outra condição','Não tenho']]
  ];
  var NONE=/^(Nenhum|Não tenho)/;
  function allD(p){ var o=(p.doencas||[]).filter(function(x){ return !NONE.test(x)&&x!=='Nenhuma dessas'; }); DC_GROUPS.forEach(function(g){ (p[g[0]]||[]).forEach(function(x){ if(!NONE.test(x))o.push(x); }); }); return o; }
  function outrasTxt(p){ var o=[]; DC_GROUPS.forEach(function(g){ var t=(p[g[0]+'_outras']||'').trim(); if(t&&(p[g[0]]||[]).some(function(x){ return /^Outr/.test(x); }))o.push(t); }); if((p.doencas_outras||'').trim())o.push(p.doencas_outras.trim()); return o.join('; '); }
  function doencasTxt(p){
    var parts=[], answered=false, any=false;
    DC_GROUPS.forEach(function(g){ var a=p[g[0]]; if(!a||!a.length)return; answered=true; var it=a.filter(function(x){ return !NONE.test(x); }); if(!it.length)return; any=true; var o=(p[g[0]+'_outras']||'').trim(); parts.push(g[1]+': '+it.map(function(x){ return /^Outr/.test(x)?(x+(o?' ('+o+')':'')):x; }).join(', ')+'.'); });
    var leg=(p.doencas||[]).filter(function(x){ return !NONE.test(x)&&x!=='Nenhuma dessas'; });
    if((p.doencas||[]).length)answered=true;
    if(leg.length){ any=true; parts.push('Geral: '+leg.map(function(x){ return /^Outr/.test(x)?(x+(p.doencas_outras?' ('+p.doencas_outras+')':'')):x; }).join(', ')+'.'); }
    if(any)return parts.join(' ');
    return answered?'Nenhuma das condições listadas':'—';
  }
  var PROBLEMAS=['Enjoo ou vômito forte depois','Dificuldade para respirar ou colocar o tubo','Reação alérgica','Acordei durante a anestesia','Febre alta ou rigidez no corpo','Outro problema','Nenhum problema'];
  var ADORNOS=['Piercing (em qualquer parte do corpo)','Unha de gel, acrílico ou fibra','Aplique ou extensão de cabelo (megahair)','Extensão de cílios','Brincos, anéis ou colares','Lentes de contato','Outro','Nenhum desses'];
  var DENTES=['Dente mole','Prótese ou ponte','Aparelho nos dentes','Piercing na boca ou língua','Outro','Nenhum desses'];
  function parseNum(v){ if(v===null||v===undefined||v==='')return null; var n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }
  function fmt(n){ return String(Math.round(n*10)/10).replace('.',','); }
  function bmi(p){ var w=parseNum(p.peso),h=parseNum(p.altura); if(!w||!h)return null; return w/Math.pow(h/100,2); }
  function toDate(s){ return new Date(s+'T00:00:00'); }
  function nowBR(){ var d=new Date(); function z(n){ return ('0'+n).slice(-2); } return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()); }
  function cnt(v){ if(v===null||v===undefined||v==='')return null; var s=String(v).trim(); if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,''); return parseNum(s); }
  function leuco(v){ var n=cnt(v); if(n===null)return null; return n<100?n*1000:n; }
  function plaq(v){ var n=cnt(v); if(n===null)return null; return n>=1000?n/1000:n; }
  /* [campo, nome, leitura, mínimo, máximo, unidade]. Faixas de adulto, variam entre laboratórios. */
  var LABCHK=[
    ['ht','Hematócrito',parseNum,34,55,'%'],
    ['leuc','Leucócitos',leuco,3500,12000,'/mm³'],
    ['tap','TAP (atividade)',parseNum,70,null,'%'],
    ['ttpa','TTPa',parseNum,null,40,'s'],
    ['ureia','Ureia',parseNum,null,50,'mg/dL'],
    ['creat','Creatinina',parseNum,null,1.2,'mg/dL'],
    ['na','Sódio',parseNum,135,145,'mEq/L'],
    ['k','Potássio',parseNum,3.5,5,'mEq/L'],
    ['ca','Cálcio',parseNum,8.5,10.5,'mg/dL'],
    ['mg','Magnésio',parseNum,1.6,2.6,'mg/dL'],
    ['tgo','TGO',parseNum,null,60,'U/L'],
    ['tgp','TGP',parseNum,null,60,'U/L'],
    ['glic','Glicemia',parseNum,70,126,'mg/dL']
  ];
  function ageOf(p,ref){ if(!p.nascimento)return null; var n=toDate(p.nascimento),r=ref||new Date(); var a=r.getFullYear()-n.getFullYear(); var m=r.getMonth()-n.getMonth(); if(m<0||(m===0&&r.getDate()<n.getDate()))a--; return a; }
  function daysBetween(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }
  function has(list,x){ return (list||[]).indexOf(x)>=0; }
  function triage(p){
    var R=[]; function add(l,t){ R.push({l:l,t:t}); }
    var f=p.ficha||{}, ex=f.exames||{}, v=f.via||{};
    var d=allD(p), pr=p.anest_problemas||[], dn=p.dentes||[];
    var b=bmi(p), a=ageOf(p);
    if(b!==null){ if(b>=40)add('vermelho','IMC '+fmt(b)+' (40 ou mais)'); else if(b>=30)add('amarelo','IMC '+fmt(b)+' (30 a 39,9)'); }
    if(a!==null&&a>=60)add('amarelo','Idade de '+a+' anos');
    if(has(d,'Problema no coração'))add('vermelho','Problema no coração');
    if(has(d,'Trombose ou coágulos'))add('vermelho','Trombose ou coágulos no histórico');
    if(d.some(function(x){ return /^Outr/.test(x); }))add('amarelo','Outra condição informada: '+(outrasTxt(p)||'sem descrição')+'. Avaliar caso a caso');
    [['Pressão alta','Pressão alta'],['Diabetes','Diabetes'],['Asma ou bronquite','Asma ou bronquite'],['Tireoide','Problema de tireoide'],['Refluxo ou azia forte','Refluxo ou azia forte'],['Anemia','Anemia']].forEach(function(k){ if(has(d,k[0]))add('amarelo',k[1]); });
    var TRATADAS=['Pressão alta','Diabetes','Asma ou bronquite','Tireoide','Refluxo ou azia forte','Anemia','Problema no coração','Trombose ou coágulos'], VERM=['AVC (derrame)','Problema de coagulação ou sangramento fácil'];
    d.forEach(function(x){ if(/^Outr/.test(x)||TRATADAS.indexOf(x)>=0)return; add(VERM.indexOf(x)>=0?'vermelho':'amarelo','Condição informada: '+x); });
    if(p.anticoag==='sim')add('vermelho','Usa anticoagulante ou AAS: definir suspensão junto com o cirurgião');
    if(p.emagrecedor==='sim')add('amarelo','Caneta emagrecedora: definir jejum e conduta'+(p.emagrecedor_qual?' ('+p.emagrecedor_qual+')':''));

  function bmiNote(){ var b=L.bmi(draft); return b===null?'Preencha peso e altura para calcular o IMC.':'Seu IMC é '+L.fmt(b)+'.'; }


  function validate(){
    var first=null;
    STEPS[step].fields.forEach(function(f){
      var er=$('#e_'+f.id); if(er)er.textContent='';
      if(f.show&&!f.show(draft))return;
      var v=draft[f.id]; var msg='';
      if(f.req){
        if(f.type==='check1'){ if(!v)msg='Marque a caixa para continuar.'; }
        else if(!v||!String(v).trim())msg='Preencha este campo.';
      }
      if(!msg&&(f.id==='peso'||f.id==='altura')&&v){ var n=L.parseNum(v); if(!n||n<=0)msg='Use apenas números.'; else if(f.id==='altura'&&(n<100||n>230))msg='Informe a altura em centímetros, por exemplo 165.'; else if(f.id==='peso'&&(n<30||n>300))msg='Informe o peso em quilos, por exemplo 62,5.'; }
      if(msg){ if(er)er.textContent=msg; if(!first)first=f.id; }
    });
    return first;
  }

  function dbToP(row){
    var p=Object.assign({},row.respostas||{});

    [['nome','paciente_nome'],['data_cirurgia','data_cirurgia'],['hospital','hospital'],['cirurgiao','cirurgiao'],['procedimento','procedimento']].forEach(function(a){ if(!p[a[0]])p[a[0]]=row[a[1]]||''; });
    if(!p.whatsapp)p.whatsapp=p.contato;
    p.tcle_aceite=!!row.tcle_aceito_em; p.tcle_quando=brFrom(row.tcle_aceito_em); p.tcle_nome=row.tcle_nome_digitado||p.tcle_nome||''; p.tcle_versao=(row.tcle&&row.tcle.versao)||''; p.tcle_texto=(row.tcle&&row.tcle.texto)||'';
    var b=blankFicha();
    p.ficha={exames:Object.assign(b.exames,row.exames||{}),via:Object.assign(b.via,row.via_aerea||{}),asa:row.asa||'',anest1:row.anest1||'',anest1_outra:row.anest1_outra||'',anest2:row.anest2||'',anest2_outra:row.anest2_outra||'',anest_motivo:row.anest_motivo||'',conduta:row.observacoes||'',orient:row.orientacoes||'',decisao:row.decisao||'',validacao:row.validada_em?{quando:brFrom(row.validada_em),decisao:DEC[row.decisao]||''}:null};

      if(r.error){ setStat('Erro ao salvar: '+r.error.message); return false; }
      p._dirty=false; setStat('Salvo'); return true;
    });
  }

  function snapshotPdfs(p){
    var C=window.jspdf.jsPDF;
    return Promise.all([['ficha_interna','interno'],['prontuario','prontuario']].map(function(pr){
      var blob=L.buildPdf(p,C,pr[1]).output('blob'), path=p.id+'/'+pr[0]+'-'+Date.now()+'.pdf';
      return blob.arrayBuffer().then(function(buf){ return crypto.subtle.digest('SHA-256',buf); }).then(function(h){
        var hex=[].map.call(new Uint8Array(h),function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
        return sb.storage.from('fichas-pdf').upload(path,blob,{contentType:'application/pdf'}).then(function(u){
          if(u.error)throw u.error;
          return sb.from('documentos').insert({avaliacao_id:p.id,tipo:pr[0],caminho:path,sha256:hex});
        }).then(function(i){ if(i.error)throw i.error; });
      });
    }));
  }

  function applyFlags(p){
    var ff=L.fieldFlags(p), host=$('#detail');
    [].slice.call(host.querySelectorAll('[data-k]')).forEach(function(el){
      var w=el.closest('.f,.row'); if(!w)return;

      var l=ff[el.getAttribute('data-k')]; if(l)w.classList.add('flag',l);
    });
    [].slice.call(host.querySelectorAll('.kv > div')).forEach(function(c){
      var b=c.querySelector('b'); if(!b)return;
      var k=L.KEYMAP[b.textContent];
      c.classList.remove('flag','amarelo','vermelho');
      if(k&&ff[k])c.classList.add('flag',ff[k]);
    });
  }


  function refresh(){
    var p=cur(); if(!p)return;
    applyFlags(p);
    var t=L.triage(p), pend=L.pendencias(p), waiting=(p.status==='convite'||p.status==='rascunho');
    $('#tri-head').innerHTML=waiting?'<span class="tag wait">Aguardando a paciente</span>':pill(t.level)+'<div class="sm muted" style="margin-block-start:4px">'+esc(ACAO[t.level])+'</div>';
    var li=t.reasons.map(function(r){ return '<li class="'+r.l+'">'+esc(r.t)+'</li>'; }).join('')+pend.map(function(x){ return '<li class="pend">'+esc(x)+'</li>'; }).join('');
    $('#tri-list').innerHTML=li||'<li>Nenhum alerta nas respostas.</li>';
    var f=p.ficha; var d=f.decisao;
    var w1=$('#w_anest1_outra'); if(w1)w1.hidden=f.anest1!=='outra';
    var w2=$('#w_anest2_outra'); if(w2)w2.hidden=f.anest2!=='outra';
    var warn=''; if((d==='liberada'||d==='ressalvas')&&(t.level==='vermelho'||pend.length))warn='<div class="note warn">Atenção: esta paciente está '+NIVEL[t.level].toLowerCase()+(pend.length?' e tem '+pend.length+' pendência'+(pend.length>1?'s':''):'')+'. Confirme que a liberação está correta.</div>';
    var needTcle=!p.tcle_aceite;
    var needAn=!f.anest1;
    var ok=!!d&&!needTcle&&!needAn;
    var html=f.validacao?'':warn;
    if(!f.validacao&&needTcle)html+='<div class="note warn">Para validar, a paciente precisa ter enviado o formulário e aceitado o termo.</div>';
    if(!f.validacao&&needAn)html+='<div class="note warn">Para validar, defina o tipo de anestesia planejada.</div>';
    if(f.validacao){ html+='<div class="val"><span class="stamp">Validada em '+esc(f.validacao.quando)+' · '+esc(f.validacao.decisao)+'</span><button type="button" class="link" id="reopen">Reabrir para editar</button></div><span class="hint">A ficha validada fica travada. Reabra para alterar; cada mudança fica registrada.</span>'; }
    else { html+='<div class="val"><button type="button" class="btn pri" id="validate"'+(ok?'':' disabled')+'>Validar avaliação</button><span class="hint">Registra data, hora e decisão e guarda os PDFs. A validação é sempre manual.</span></div>'; }
    html+='<div class="val"><button type="button" class="btn pri" id="pdfp">Baixar prontuário completo (para a paciente)</button><button type="button" class="btn" id="pdf">Baixar com triagem (uso interno)</button><span class="hint">O prontuário é a cópia integral da avaliação, sem a triagem automática, e é o que a paciente recebe. O outro PDF inclui o semáforo de risco, só para você. <span id="pdfmsg" role="status"></span></span></div>';
    $('#val-box').innerHTML=html;
    var vb=$('#validate'); if(vb)vb.addEventListener('click',function(){
      vb.disabled=true; setStat('Validando…');
      flushFicha(p).then(function(){ return sb.rpc('validar_avaliacao',{p_id:p.id}); }).then(function(r){
        if(r.error){ setStat(''); vb.disabled=false; $('#val-box').insertAdjacentHTML('afterbegin','<div class="note warn">'+esc(r.error.message)+'</div>'); return; }
        return reloadOne(p.id).then(function(np){
          if(!np)return;
          return snapshotPdfs(np).then(function(){ setStat('Validada e PDFs guardados'); loadDocs(np); },function(){ setStat('Validada, mas os PDFs não foram guardados. Baixe e guarde por conta própria.'); });
        });
      });
    });
    var rb=$('#reopen'); if(rb)rb.addEventListener('click',function(){
      rb.disabled=true;
      sb.rpc('reabrir_avaliacao',{p_id:p.id}).then(function(r){ if(r.error){ rb.disabled=false; setStat('Erro: '+r.error.message); return; } reloadOne(p.id); });
    });
    [['pdf','interno'],['pdfp','prontuario']].forEach(function(pair){
      var pb=$('#'+pair[0]); if(!pb)return;
      pb.addEventListener('click',function(){
        var msg=$('#pdfmsg');
        try{
          var C=window.jspdf&&window.jspdf.jsPDF;
          if(!C){ msg.textContent='A biblioteca de PDF não carregou. Recarregue a página.'; return; }
          L.buildPdf(p,C,pair[1]).save((pair[1]==='prontuario'?'prontuario-pre-anestesico-':'ficha-com-triagem-')+slug(p.nome)+'-'+(p.data_cirurgia||'sem-data')+'.pdf');
          msg.textContent='PDF gerado. Procure na pasta de downloads.';
        }catch(e){ msg.textContent='Não foi possível gerar o PDF.'; }
      });
    });
    renderList();
  }

    }
    if(el.hasAttribute('data-doc')){
      sb.storage.from('fichas-pdf').download(el.getAttribute('data-doc')).then(function(r){
        if(r.error||!r.data){ el.textContent='Não consegui baixar'; return; }
        var a=document.createElement('a'); a.href=URL.createObjectURL(r.data); a.download=el.getAttribute('data-doc').split('/').pop(); document.body.appendChild(a); a.click(); a.remove();
      });
      return;
    }
    if(el.id==='newlink'){
      var p=cur(); if(!p)return; el.disabled=true;
      sb.rpc('renovar_convite',{p_id:p.id,p_dias:p.status==='validada'?60:14}).then(function(r){
        el.disabled=false;
        if(r.error){ $('#linkbox').innerHTML='<span class="msg bad">Não consegui gerar o link: '+esc(r.error.message)+'</span>'; return; }
        showLink(p,r.data.token);
      });
    }
  });

  $('#detail').addEventListener('click',function(e){
    var p=cur(); if(!p)return;
    if(e.target.id==='editmodel'){ show('md'); return; }
    if(e.target.id==='gen'){
      var ta=$('#x_orient'), gb=e.target;
      if(ta.value.trim()&&!gb.getAttribute('data-armed')){
        gb.setAttribute('data-armed','1'); gb.textContent='Substituir o texto atual?';
        setTimeout(function(){ gb.removeAttribute('data-armed'); gb.textContent='Gerar texto-base'; },5000);
        return;
      }
      gb.removeAttribute('data-armed'); gb.textContent='Gerar texto-base';
      ta.value=genOrient(p); p.ficha.orient=ta.value; refresh(); queueSave(p);
    }
    if(e.target.id==='copy'){
      var ta2=$('#x_orient'); var msg=$('#copied');
      try{ navigator.clipboard.writeText(ta2.value).then(function(){ msg.textContent='Texto copiado.'; }).catch(function(){ ta2.select(); msg.textContent='Texto selecionado. Copie com Ctrl+C.'; }); }catch(x){ ta2.select(); msg.textContent='Texto selecionado. Copie com Ctrl+C.'; }
    }
  });

  /*MODELO-INI*/
  var TPL_KEY='apa-modelo-orientacoes';
  function defaultTpl(){
    var an={}; L.ANEST.forEach(function(a){ an[a[0]]=a[2]; });
    return {
      saudacao:'Olá, {nome}! Segue o resumo das orientações para a sua anestesia. Leia com calma e me chame se ficar com qualquer dúvida.',
      fechamento:'Qualquer dúvida, responda esta mensagem.',
      anest:an,
      secoes:[
        {id:'anestesia',titulo:'SOBRE A SUA ANESTESIA',texto:'A escolha final é confirmada com você no dia da cirurgia e pode mudar por segurança.'},
        {id:'jejum_por_que',titulo:'JEJUM: POR QUE É TÃO IMPORTANTE',texto:'Durante a anestesia, os reflexos que protegem o pulmão ficam reduzidos. Se houver comida ou líquido no estômago, ele pode voltar e cair no pulmão, causando uma pneumonia grave. Por isso o jejum é uma regra de segurança, e a cirurgia pode ser adiada se ele não for cumprido. Conte sempre a verdade sobre o que comeu e bebeu.'},
        {id:'jejum_horas',titulo:'QUANTAS HORAS, E DE QUÊ (contando até o horário da cirurgia)',texto:[
          '• 8 horas antes: refeições completas e alimentos gordurosos. Ex.: arroz, feijão, carnes, ovos, frituras, feijoada, pizza, hambúrguer, castanhas.',
          '• 6 horas antes: refeições leves e leite. Ex.: pão, torrada, bolacha, tapioca, fruta, iogurte, mingau, leite, café com leite, vitamina e suco com polpa.',
          '• 2 horas antes: só líquidos claros, aqueles que deixam enxergar através. Ex.: água, água de coco, chá ou café sem leite, suco coado sem polpa, isotônico.',
          '• Nas 2 horas antes da cirurgia: nada, nem água. Evite também chiclete, bala e cigarro durante o jejum.',
          '',
          'Exemplo: cirurgia às 14h. Refeição completa até 6h, refeição leve até 8h e líquidos claros até 12h.',
          'Se o horário da cirurgia mudar, eu aviso o novo horário do jejum.'].join('\n')},
        {id:'agua',titulo:'NÃO FIQUE SEM TOMAR ÁGUA',texto:'Jejum de comida não é jejum de água. Passar muitas horas sem beber deixa você desidratada, o que piora tontura, queda de pressão, enjoo e dor de cabeça, e dificulta pegar a veia. Beba água normalmente e pode tomar até 1 garrafa de 500 ml, até 2 horas antes do horário da cirurgia. Depois disso, nada.'},
        {id:'medic',titulo:'MEDICAMENTOS',texto:'• Não tome nenhum remédio novo sem avisar a anestesista.'},
        {id:'casa',titulo:'ANTES DE SAIR DE CASA',texto:[
          '• Tome banho e escove os dentes, sem engolir a água.',
          '• Não venha com o cabelo molhado: molhado, o corpo perde calor e você sente mais frio e tremor.',
          '• Não passe hidratante, creme ou óleo no corpo logo depois do banho. Isso atrapalha os eletrodos do monitor e a fixação dos curativos.',
          '• Venha sem maquiagem no rosto, se possível.'].join('\n')},
        {id:'retire',titulo:'RETIRE ANTES DA CIRURGIA',texto:[
          '• Joias, brincos, anéis, piercings, relógio e outros adornos.',
          '• Prótese dentária removível. Se tiver dente mole ou aparelho, avise.',
          '• Lentes de contato. Se usa, venha com óculos.',
          '• Extensão de cílios e extensão de cabelo (megahair).',
          '• Esmalte: use só cores claras ou retire. Cores escuras atrapalham o aparelho que mede o oxigênio no seu dedo.',
          '• Unhas muito compridas: evite, elas também atrapalham esse aparelho.'].join('\n')},
        {id:'acomp',titulo:'ACOMPANHANTE E DOCUMENTOS',texto:[
          '• Venha com um adulto responsável, maior de 18 anos, que fique com você e leve você para casa.',
          '• Traga documento oficial com foto, seus exames e o risco cirúrgico.',
          '• Avise se tiver febre, gripe, tosse ou qualquer mudança na saúde antes da cirurgia.'].join('\n')},
        {id:'p24',titulo:'NAS PRIMEIRAS 24 HORAS DEPOIS',texto:[
          '• Não dirija.',
          '• Não assine documentos importantes.',
          '• Não marque compromissos importantes.',
          '• Fique aos cuidados de um adulto de confiança.',
          '• Aproveite para repousar.',
          '',
          'Por que isso é importante? Os medicamentos da anestesia saem do corpo aos poucos. Mesmo que você se sinta bem, nas primeiras 24 horas a atenção, os reflexos, o equilíbrio, a memória e a capacidade de decidir podem estar alterados, e você pode ficar sonolenta, tonta ou enjoada. Dirigir ou assinar algo nesse período traz risco de acidente e de decisões das quais você pode não lembrar. O adulto de confiança ajuda se você passar mal ou sentir tontura, e o repouso ajuda a sua recuperação.'].join('\n')}
      ]
    };
  }
  function mergeTpl(s){
    var d=defaultTpl(); if(!s||typeof s!=='object')return d;
    if(typeof s.saudacao==='string')d.saudacao=s.saudacao;
    if(typeof s.fechamento==='string')d.fechamento=s.fechamento;
    if(Array.isArray(s.secoes))d.secoes.forEach(function(x){ s.secoes.forEach(function(y){ if(y&&y.id===x.id){ if(typeof y.titulo==='string')x.titulo=y.titulo; if(typeof y.texto==='string')x.texto=y.texto; } }); });
    if(s.anest&&typeof s.anest==='object'){ for(var k in s.anest){ if(typeof s.anest[k]==='string')d.anest[k]=s.anest[k]; } }
    return d;
  }
  var tpl=defaultTpl();
  try{ var rawT=localStorage.getItem(TPL_KEY); if(rawT)tpl=mergeTpl(JSON.parse(rawT)); }catch(e){}

  function genOrient(p){
    var T=tpl, f=p.ficha||{}, o=[], nome=(p.nome||'').split(' ')[0];
    function lines(t){ String(t||'').split(/\r?\n/).forEach(function(l){ o.push(l); }); }
    lines(T.saudacao.replace(/\{nome\}/g,nome));
    T.secoes.forEach(function(s){
      o.push(''); o.push(s.titulo);
      if(s.id==='anestesia'){
        if(f.anest1){
          o.push('Tipo planejado: '+L.anestLabel(f.anest1,f.anest1_outra)+'.');
          if(T.anest[f.anest1])o.push(T.anest[f.anest1]);
          if(f.anest2&&f.anest2!=='nenhuma'){
            o.push(''); o.push('Alternativa, se for preciso mudar: '+L.anestLabel(f.anest2,f.anest2_outra)+'.');
            if(T.anest[f.anest2])o.push(T.anest[f.anest2]);
          }
          if(f.anest_motivo)o.push('Quando a alternativa é usada: '+f.anest_motivo);
          o.push(''); lines(s.texto);
        } else { o.push('[definir o tipo de anestesia e a alternativa na ficha]'); }
        return;
      }
      if(s.id==='medic'){
        if(p.medicacoes&&!/^(n[aã]o|nenhum)/i.test(p.medicacoes.trim()))o.push('• Em uso: '+p.medicacoes+'. [definir quais tomar com um gole de água no dia].');
        if(p.hormonio==='sim')o.push('• Hormônio ('+(p.hormonio_qual||'informado')+'): [definir manter ou suspender, junto com o cirurgião].');
        if(p.anticoag==='sim')o.push('• Afinador do sangue ou aspirina: [definir suspensão, junto com o cirurgião]. Não pare por conta própria.');
        if(p.suplementos&&p.suplementos.trim())o.push('• Suplementos e chás: '+p.suplementos+'. [definir quando suspender].');
      }
      lines(s.texto);
      if(s.id==='jejum_horas'&&p.emagrecedor==='sim')o.push('• Caneta emagrecedora ('+(p.emagrecedor_qual||'informada no formulário')+'): [definir quando suspender e se o jejum será maior].');
    });
    o.push(''); lines(T.fechamento);
    return o.join('\n');
  }
  /*MODELO-FIM*/

  /* ===== Tela de modelos ===== */
  var dirty=false, armed=false;
  var HINTS={anestesia:'Antes deste texto entram o tipo de anestesia e a alternativa escolhidos na ficha.',jejum_horas:'Se a paciente usa caneta emagrecedora, entra uma linha extra no fim.',medic:'Antes deste texto entram os medicamentos e suplementos que a paciente informou.'};
  function mdLine(key,label,val,hint){ return '<div class="f"><label class="lbl" for="md_'+key+'">'+esc(label)+'</label><input type="text" id="md_'+key+'" data-md="'+key+'" value="'+esc(val||'')+'" autocomplete="off">'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>'; }
  function mdArea(key,label,val,hint){ var n=String(val||'').split('\n').length; return '<div class="f"><label class="lbl" for="md_'+key+'">'+esc(label)+'</label><textarea id="md_'+key+'" data-md="'+key+'" rows="'+Math.max(3,Math.min(n+1,14))+'">'+esc(val||'')+'</textarea>'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>'; }
  function mdMsg(t){ var m=$('#md_msg'); if(m)m.textContent=t; }
  function renderMd(){
    var h='<div class="head"><h1>Modelos de texto</h1><p class="muted sm">Estes textos alimentam o botão “Gerar texto-base” da ficha. Edite uma vez e vale para todas as próximas pacientes. Os trechos que dependem das respostas da paciente continuam sendo gerados.</p></div>';
    h+='<div class="card"><h3>Saudação e fechamento</h3>'+mdLine('saud','Saudação',tpl.saudacao,'Use {nome} para o primeiro nome da paciente.')+mdLine('fech','Fechamento',tpl.fechamento)+'</div>';
    tpl.secoes.forEach(function(s,i){
      h+='<div class="card">'+mdLine('t'+i,'Título da seção',s.titulo)+mdArea('x'+i,'Texto',s.texto,HINTS[s.id])+'</div>';
    });
    h+='<div class="card"><h3>Como explicar cada anestesia</h3><p class="muted sm">Entram na seção “Sobre a sua anestesia”, conforme o tipo escolhido na ficha.</p>';
    L.ANEST.forEach(function(a){ if(a[0]!=='outra')h+=mdArea('a_'+a[0],a[1],tpl.anest[a[0]]); });
    h+='</div>';
    h+='<div class="card"><div class="actions"><button type="button" class="btn" id="md_reset">Restaurar texto padrão</button><button type="button" class="btn pri" id="md_save">Salvar modelo</button></div><div class="hint" id="md_msg" role="status">'+(dirty?'Alterações ainda não salvas.':'')+'</div></div>';
    $('#v-md').innerHTML=h;
  }
  $('#v-md').addEventListener('input',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-md'); if(!k)return; var v=e.target.value;
    if(k==='saud')tpl.saudacao=v; else if(k==='fech')tpl.fechamento=v;
    else if(k.charAt(0)==='t')tpl.secoes[+k.slice(1)].titulo=v;
    else if(k.charAt(0)==='x')tpl.secoes[+k.slice(1)].texto=v;
    else if(k.indexOf('a_')===0)tpl.anest[k.slice(2)]=v;
    dirty=true; mdMsg('Alterações ainda não salvas.');
  });
  $('#v-md').addEventListener('click',function(e){
    if(e.target.id==='md_save'){ saveTpl(); return; }
    if(e.target.id==='md_reset'){
      if(!armed){ armed=true; e.target.textContent='Confirmar: apagar minhas edições'; setTimeout(function(){ armed=false; var b=$('#md_reset'); if(b)b.textContent='Restaurar texto padrão'; },5000); return; }
      armed=false; tpl=defaultTpl(); dirty=true; renderMd(); mdMsg('Texto padrão restaurado. Clique em “Salvar modelo” para guardar.');
    }
  });


  function saveTpl(){
    var json=JSON.stringify(tpl), local=false;
    try{ localStorage.setItem(TPL_KEY,json); local=true; }catch(e){}
    if(!sb){ dirty=false; mdMsg(local?'Salvo só neste navegador.':'Não foi possível salvar.'); return; }
    mdMsg('Salvando…');
    sb.from('modelos').upsert({chave:'orientacoes',conteudo:{json:json},atualizado_em:new Date().toISOString()},{onConflict:'chave'}).then(function(r){
      if(r.error){ mdMsg((local?'Salvo só neste navegador. ':'')+'Não consegui salvar no sistema: '+r.error.message); return; }
      dirty=false; mdMsg('Modelo salvo. Vale para as próximas fichas.');
    });
  }
  function loadTpl(){
    sb.from('modelos').select('conteudo').eq('chave','orientacoes').maybeSingle().then(function(r){
      if(r.error||!r.data||!r.data.conteudo||typeof r.data.conteudo.json!=='string')return;
      try{ tpl=mergeTpl(JSON.parse(r.data.conteudo.json)); if(!$('#v-md').hidden&&!dirty)renderMd(); }catch(x){}
    });
  }

  ['fx','nv','md','ac'].forEach(function(k){ $('#tab-'+k).addEventListener('click',function(){ show(k); }); });
  $('#logout').addEventListener('click',function(){ if(sb)sb.auth.signOut(); });

  var mt=location.hash.match(/^#\/p\/([A-Za-z0-9]+)$/);
  if(mt){ MODE='paciente'; TOKEN=mt[1]; bootPatient(); } else { startStaff(); }

})();
</script>
</body>
</html>
